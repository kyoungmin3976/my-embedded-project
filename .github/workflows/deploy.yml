name: Local Build on Self-Hosted Runner

on:
  push:
    branches: [ main ]

jobs:
  build:
    # 중요: 방금 만든 내 우분투(self-hosted)에서 실행하라는 뜻입니다.
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Project
        run: |
          # 이미 내 컴퓨터 안이므로 복잡한 접속 과정이 필요 없습니다.
          cd ~/test
          git pull origin main
          make clean
          make
          echo "==================================="
          echo "내 서버에서 직접 빌드를 완료했습니다!"
          echo "==================================="